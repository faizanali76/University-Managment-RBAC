spring.application.name=university-managment

# Change the port
server.port=8081

# Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/university?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Faizan@123

# Hibernate Strategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Secret cryptographic signing key
university.app.jwtSecret=SecretUniversitySecurityKeyForRBACSystem2026MustBeLongEnough
# Token lifespan configuration
university.app.jwtExpirationMs=86400000


spring.cache.cache-names=studentRoster,studentCards
spring.cache.caffeine.spec=expireAfterWrite=6000s,maximumSize=500

management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.propagation.type=B3


management.tracing.logging.annotation.enabled=true

logging.pattern.console=%d{HH:mm:ss} %-5level [${spring.application.name},%X{traceId:-NOTRACE},%X{spanId:-NOSPAN}] %logger{36} - %msg%n
#logging.level.org.springframework.boot.actuate.autoconfigure.observation=DEBUG
#logging.level.io.micrometer=DEBUG

# 7 days for the Refresh Token (604800000 milliseconds)
university.app.jwtRefreshExpirationMs=604800000